<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <defs>
    <radialGradient id="bh-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0bd3d" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#f0bd3d" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f0bd3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bh-disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0bd3d" stop-opacity="0"/>
      <stop offset="12%" stop-color="#7a3d00" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#f0bd3d" stop-opacity="1"/>
      <stop offset="50%" stop-color="#fff3d6" stop-opacity="1"/>
      <stop offset="70%" stop-color="#f0bd3d" stop-opacity="1"/>
      <stop offset="88%" stop-color="#7a3d00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f0bd3d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- faint halo (part of mark, not a background) -->
  <ellipse cx="160" cy="80" rx="150" ry="58" fill="url(#bh-glow)"/>

  <!-- back half of the accretion disk (goes behind the hole) -->
  <ellipse cx="160" cy="82" rx="146" ry="12" fill="none"
           stroke="url(#bh-disk)" stroke-width="8" opacity="0.85"/>

  <!-- event horizon: pure black -->
  <circle cx="160" cy="78" r="52" fill="#000000"/>
  <!-- photon ring rim -->
  <circle cx="160" cy="78" r="52" fill="none" stroke="#ffd9a0"
          stroke-width="1.4" opacity="0.8"/>
  <circle cx="160" cy="78" r="57" fill="none" stroke="#f0bd3d"
          stroke-width="1" opacity="0.22"/>

  <!-- gravitationally lensed disk: arcs warping over and under the shadow -->
  <path d="M 102,70 C 120,14 200,14 218,70" fill="none"
        stroke="url(#bh-disk)" stroke-width="3.6" stroke-linecap="round" opacity="0.95"/>
  <path d="M 102,88 C 122,146 198,146 218,88" fill="none"
        stroke="url(#bh-disk)" stroke-width="3.6" stroke-linecap="round" opacity="0.95"/>

  <!-- front edge of the disk, crossing in front of the hole -->
  <path d="M 16,90 C 90,102 230,102 304,90" fill="none"
        stroke="url(#bh-disk)" stroke-width="9" stroke-linecap="round" opacity="0.95"/>
  <path d="M 16,90 C 90,102 230,102 304,90" fill="none"
        stroke="#fff3d6" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
</svg>
